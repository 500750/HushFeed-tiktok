name: Build HushFeed Patch

on:
  workflow_dispatch: # 仅允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # 允许云端读取私有包

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        # 这里用的是你提供的完整命令，已经包含了跳过测试和关掉校验
        run: ./gradlew :patches:buildAndroid -x test --no-build-cache -Dorg.gradle.dependency.verification=off

      - name: Upload MPP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HushFeed-Patches
          path: patches/build/release/*.mpp
