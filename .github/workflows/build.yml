name: Build HushFeed Patch

on:
  workflow_dispatch: # 仅允许在 Actions 页面手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # 允许读取 GitHub Packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 强行把凭证写入 gradle.properties，解决 401 报错
          echo "gpr.user=${{ github.actor }}" >> gradle.properties
          echo "gpr.key=${{ secrets.GH_TOKEN }}" >> gradle.properties
          
          # 执行编译（跳过测试、禁用缓存、关闭依赖校验）
          ./gradlew :patches:buildAndroid -x test --no-build-cache -Dorg.gradle.dependency.verification=off

      - name: Upload MPP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HushFeed-Patches
          path: patches/build/release/*.mpp
